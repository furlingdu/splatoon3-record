name: splatoon3record
description: Splatoon3 Record
publish_to: none
version: 3.0.0+30000

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^7.2.2
  camera: ^0.12.1
  crypto: ^3.0.6
  cryptography: ^2.9.0
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.7
  ffi: ^2.1.3
  file_selector: ^1.1.0
  flutter_ffi_uvc: ^1.1.2
  haishin_kit: ^0.16.0
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_video: ^1.0.11
  media_kit_libs_windows_video: ^1.0.11
  media_kit_video: ^2.0.1
  linux_capture:
    path: packages/linux_capture
  macos_capture:
    path: packages/macos_capture
  mobile_capture:
    path: packages/mobile_capture
  package_info_plus: ^10.2.2
  path: ^1.9.0
  path_provider: ^2.1.6
  qr: ^4.0.0
  screen_retriever: ^0.2.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  window_manager: ^0.5.2
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  analyzer: ^8.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/backgrounds/
    - assets/models/
    - path: assets/tools/
      platforms:
        - windows
        - macos
        - linux
  fonts:
    - family: Splatoon1
      fonts:
        - asset: assets/fonts/SplatoonCommon.ttf
    - family: SplatoonCjk
      fonts:
        - asset: assets/fonts/SplatoonCjk.ttf
    - family: SplatoonKana
      fonts:
        - asset: assets/fonts/SplatoonKana.ttf
    - family: SplatoonSymbol
      fonts:
        - asset: assets/fonts/SplatoonSymbol.ttf
    - family: SplatoonZhL1
      fonts:
        - asset: assets/fonts/SplatoonZhL1.ttf
    - family: SplatoonZhL2
      fonts:
        - asset: assets/fonts/SplatoonZhL2.ttf









dependency_overrides:
  camera_avfoundation:
    path: third_party/camera_avfoundation
