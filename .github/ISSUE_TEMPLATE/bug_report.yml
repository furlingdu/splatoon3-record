name: 问题反馈
description: 报告缺陷或异常行为
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        反馈前请先在关于页点击「复制设备信息」，把复制到的内容粘贴到下面的设备信息里。
        采集、录制、直播、打码相关的问题缺少该信息通常无法定位。
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么，你期望发生什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 观察到…
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: 设备信息
      description: 关于页 → 复制设备信息 → 粘贴到这里
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 日志片段、截图或录屏
    validations:
      required: false
