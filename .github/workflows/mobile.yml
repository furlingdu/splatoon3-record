name: Mobile

on:
  workflow_dispatch:
    inputs:
      target:
        description: "构建目标"
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
          - macos
          - linux
          - windows
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ios:
    name: iOS unsigned ipa
    runs-on: macos-15
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ios'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build runner app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned ipa
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Splatoon3Record-${{ github.run_number }}-unsigned.ipa Payload
          ls -lh *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ipa-unsigned
          path: "*.ipa"
          if-no-files-found: error

  android:
    name: Android apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build apk
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Fetch FFmpeg
        run: bash tool/FetchFFmpeg.sh macos-arm64
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build macOS app
        run: flutter build macos --release
      - name: Package
        run: |
          App="build/macos/Build/Products/Release/splatoon3record.app"
          find "$App" -name '._*' -delete
          codesign --force --deep -s - "$App"
          ditto -c -k --sequesterRsrc --keepParent "$App" Splatoon3Record-3.0.0-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: "*.zip"
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold libgtk-3-dev libjson-glib-dev libasound2-dev libmpv-dev ninja-build
      - name: Fetch FFmpeg
        run: bash tool/FetchFFmpeg.sh linux-x64
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Linux app
        run: |
          set +e
          flutter build linux --release
          Code=$?
          if [ $Code -ne 0 ]; then
            cd build/linux/x64/release
            ninja -v 2>&1 | tail -120
          fi
          exit $Code
      - name: Package
        run: tar -czf Splatoon3Record-3.0.0-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: "*.tar.gz"
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Fetch FFmpeg
        shell: pwsh
        run: ./tool/FetchFFmpeg.ps1 -Target windows-x64
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Windows app
        run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup\Setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: "dist/*.exe"
          if-no-files-found: error
