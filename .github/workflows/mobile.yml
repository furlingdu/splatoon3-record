name: Mobile

on:
  workflow_dispatch:
    inputs:
      target:
        description: "构建目标"
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ios:
    name: iOS unsigned ipa
    runs-on: macos-14
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ios'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build runner app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned ipa
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Splatoon3Record-${{ github.run_number }}-unsigned.ipa Payload
          ls -lh *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ipa-unsigned
          path: "*.ipa"
          if-no-files-found: error

  android:
    name: Android apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build arm64 apk
        run: flutter build apk --release --target-platform android-arm64
      - name: Build armv7 apk
        run: flutter build apk --release --target-platform android-arm
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
